name: Bootstrap Gradle Wrapper

on:
  push:
    branches: [main]
    paths-ignore:
      - gradle/wrapper/gradle-wrapper.jar

permissions:
  contents: write

jobs:
  add-wrapper-jar:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download official Gradle 8.13 wrapper JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gradle/wrapper
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradle/wrapper/gradle-wrapper.jar \
            --output gradle/wrapper/gradle-wrapper.jar
          echo "81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict

      - name: Commit verified wrapper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/wrapper/gradle-wrapper.jar
          git diff --cached --quiet && exit 0
          git commit -m "Add verified Gradle wrapper JAR"
          git push origin HEAD:main
